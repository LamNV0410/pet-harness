# Project adapter for furwatch-app (blueprint 04 §5, D1 = origin/dev_v3). Only glob patterns, no secret values.
# Angular 18 needs Node <= 22, so npm/npx run with the system Node (toolchain: node-system).
id: furwatch-app
name: furwatch-app
path: ../furwatch-app
baseRef: origin/dev_v3
secretPaths:
  - "**/google-services.json"
  - "**/GoogleService-Info*.plist"
  - "src/environments/**"
  - "src/index.html"
  - "src/firebase-messaging-sw.js"
generated:
  - "android/**"
  - "ios/**"
  - "www/**"
  - "**/dist/**"
commands:
  install:
    {
      argv: [npm, install, --legacy-peer-deps, --no-audit, --no-fund],
      approval: ask,
      toolchain: node-system,
      timeoutMinutes: 30,
    }
  build: { argv: [npm, run, build], toolchain: node-system, timeoutMinutes: 30 }
  lint: { argv: [npm, run, lint], toolchain: node-system }
  test: { argv: [npx, ng, test, --watch=false, --browsers=ChromeHeadless], toolchain: node-system }
  run: { argv: [npm, run, dev], approval: ask, toolchain: node-system, port: 4200 }
health:
  path: /
